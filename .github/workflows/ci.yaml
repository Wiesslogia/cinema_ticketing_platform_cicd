  # This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read 

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: cinema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema -d cinema"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cinema:ci-throwaway-password@localhost:5432/cinema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: psql "${DATABASE_URL}" -f db/init.sql"
      - run: pytest -v


  build-scan-push:
    needs: [lint, test]                 # only runs if both pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                   # needed only here, to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Set image name and tag
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"        # GHCR requires lowercase
          echo "IMAGE=ghcr.io/${OWNER}/cinema-api" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true                    # keep in the runner so we can scan it
          push: false
          provenance: false             # single manifest, simpler digest
          tags: ${{ env.IMAGE }}:${{ env.SHORT_SHA }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true          # skip vulnerabilities with no patch yet
          exit-code: "1"                # fail the job if any are found

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in token, no stored secret

      - name: Push image and record digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:$SHORT_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$SHORT_SHA")
          echo "Pushed: $DIGEST"
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: \`$SHORT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"